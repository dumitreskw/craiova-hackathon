[project]
name = "osint-backend"
version = "0.1.0"
description = "CyberSecurity OSINT platform — backend and MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=2.3",
]

[project.optional-dependencies]
# Screenshot evidence (connectors/screenshot.py); also run `playwright install chromium`.
evidence = [
    "playwright>=1.64",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
