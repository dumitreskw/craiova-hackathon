# OSINT platform on a Coolify server (Coolify's proxy owns 80/443 and TLS).
#
# In Coolify: New resource -> Public repository
#   https://github.com/dumitreskw/craiova-hackathon  (branch main)
#   Build pack: Docker Compose, compose file: /docker-compose.coolify.yml
#   Domain for the "gateway" service: https://osint.<your-domain>
#   Environment: paste the variables from .env.example (secrets marked secret).
#
# Differences from docker-compose.yml: no published ports, configs baked into
# images (no bind mounts), and the internal Caddy ("gateway") speaks plain
# HTTP behind Coolify's proxy while still doing the basic-auth login, the
# X-Analyst audit identity, /mcp routing and SSE. OSINT_BASIC_AUTH_HASH may be
# base64-encoded (no "$" for the env file to mangle).

services:
  gateway:
    # Config baked into the image: Coolify runs the stack without the repo
    # checkout, so bind-mounting repo files would mount empty directories.
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      OSINT_BASIC_AUTH_USER: ${OSINT_BASIC_AUTH_USER:?set OSINT_BASIC_AUTH_USER}
      OSINT_BASIC_AUTH_HASH: ${OSINT_BASIC_AUTH_HASH:?set OSINT_BASIC_AUTH_HASH}
    depends_on:
      - app

  app:
    build:
      context: .
      # Build id: SOURCE_COMMIT if set (Coolify can), else the Dockerfile reads .git.
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      OSINT_DATA_DIR: /data
      SEARXNG_URL: http://searxng:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OSINT_AGENT_MODEL: ${OSINT_AGENT_MODEL:-claude-opus-5-5}
      OSINT_WORKER_MODEL: ${OSINT_WORKER_MODEL:-claude-sonnet-5-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      CERTSPOTTER_API_KEY: ${CERTSPOTTER_API_KEY:-}
      DNSDUMPSTER_API_KEY: ${DNSDUMPSTER_API_KEY:-}
      NETLAS_API_KEY: ${NETLAS_API_KEY:-}
      CHAOS_API_KEY: ${CHAOS_API_KEY:-}
      WHOISXML_API_KEY: ${WHOISXML_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      TOMBA_API_KEY: ${TOMBA_API_KEY:-}
      TOMBA_API_SECRET: ${TOMBA_API_SECRET:-}
      DEHASHED_API_KEY: ${DEHASHED_API_KEY:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      OSINT_EGRESS_LABEL: ${OSINT_EGRESS_LABEL:-coolify}
      OSINT_WORKER_TOKEN: ${OSINT_WORKER_TOKEN:-}
      OSINT_RETENTION_DAYS: ${OSINT_RETENTION_DAYS:-90}
    volumes:
      - osint_data:/data
    shm_size: "512m"
    depends_on:
      - searxng

  searxng:
    build:
      context: .
      dockerfile: docker/searxng.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]

  mcp:
    build: .   # same Dockerfile as app; layers come from the build cache
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    expose:
      - "8787"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8787"
      MCP_ALLOW_ACTIVE: "0"
      SEARXNG_URL: http://searxng:8080
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
    depends_on:
      - app
    healthcheck:
      disable: true

volumes:
  osint_data:
