name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose files
        env:
          # Required by docker-compose.coolify.yml; placeholders for validation only.
          OSINT_OIDC_ISSUER: https://auth.example.com/realms/osint
          OSINT_OIDC_CLIENT_SECRET: placeholder
          OSINT_PUBLIC_URL: https://osint.example.com
          SEARXNG_SECRET: placeholder
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile egress config -q
          docker compose -f docker-compose.coolify.yml config -q
          docker compose -f deploy/keycloak/docker-compose.yml config -q
